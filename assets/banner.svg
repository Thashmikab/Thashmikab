<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t d">
  <title id="t">Thashmika Bandara</title>
  <desc id="d">Offshore wind turbines turning at sea, with a copper cable carrying power to shore.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#14304a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3550"/>
      <stop offset="1" stop-color="#081a29"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e08a4c"/>
      <stop offset="1" stop-color="#f6b37a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="260" rx="16"/></clipPath>

    <!-- one turbine, hub at (0,0); tower goes down to the sea -->
    <g id="blades">
      <path d="M0 0 L-3 -6 L0 -58 L3 -6 Z"/>
      <path d="M0 0 L-3 -6 L0 -58 L3 -6 Z" transform="rotate(120)"/>
      <path d="M0 0 L-3 -6 L0 -58 L3 -6 Z" transform="rotate(240)"/>
    </g>
  </defs>

  <style>
    .title{font:700 38px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#eef4fa}
    .sub{font:400 16px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#9fb6cc}
    .tag{font:600 12px ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#f6b37a;letter-spacing:.08em}
    .fade1{opacity:0;animation:up .9s ease-out .2s forwards}
    .fade2{opacity:0;animation:up .9s ease-out .6s forwards}
    .fade3{opacity:0;animation:up .9s ease-out 1s forwards}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    .cable{fill:none;stroke:url(#cu);stroke-width:2.5;stroke-linecap:round;
           stroke-dasharray:700;stroke-dashoffset:700;animation:draw 3s ease-in-out 1.2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .pulse{fill:#ffd2a8;opacity:0;animation:show .1s linear 4.2s forwards}
    @keyframes show{to{opacity:1}}

    .wave{fill:none;stroke:#2c5b7d;stroke-width:1.5;opacity:.6;animation:drift 7s linear infinite}
    .wave.b{stroke:#244c69;animation-duration:11s;animation-direction:reverse}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}

    .star{fill:#cfe0f0;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}

    @media (prefers-reduced-motion: reduce){
      *{animation:none !important}
      .fade1,.fade2,.fade3,.pulse{opacity:1}
      .cable{stroke-dashoffset:0}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="960" height="260" fill="url(#sky)"/>

    <!-- stars -->
    <circle class="star" cx="520" cy="30" r="1.2"/>
    <circle class="star" cx="610" cy="58" r="1" style="animation-delay:1s"/>
    <circle class="star" cx="700" cy="22" r="1.4" style="animation-delay:.5s"/>
    <circle class="star" cx="820" cy="44" r="1" style="animation-delay:1.7s"/>
    <circle class="star" cx="905" cy="26" r="1.2" style="animation-delay:2.3s"/>
    <circle class="star" cx="470" cy="70" r="1" style="animation-delay:1.3s"/>

    <!-- sea -->
    <rect y="196" width="960" height="64" fill="url(#sea)"/>
    <g>
      <path class="wave" d="M0 210 q15 -5 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0"/>
      <path class="wave b" d="M-120 232 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    </g>

    <!-- shore / substation on the left of the turbines -->
    <path d="M556 196 L582 187 L626 185 L644 196 Z" fill="#0d2233"/>
    <rect x="590" y="169" width="22" height="16" rx="2" fill="#1d3b54" stroke="#3d6584"/>
    <rect x="594" y="173" width="4" height="4" fill="#f6b37a"/>
    <rect x="602" y="173" width="4" height="4" fill="#f6b37a" opacity=".6"/>

    <!-- copper export cable: turbines -> shore, drawn on load -->
    <path id="cablePath" class="cable"
          d="M905 196 C 895 220, 840 222, 822 196 C 812 220, 760 222, 740 196 C 730 220, 680 222, 662 196 C 652 220, 615 222, 601 196 L 601 185"/>
    <circle class="pulse" r="3.2">
      <animateMotion dur="2.6s" begin="4.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
        <mpath href="#cablePath"/>
      </animateMotion>
    </circle>
    <circle class="pulse" r="2.4" style="animation-delay:5.5s">
      <animateMotion dur="2.6s" begin="5.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
        <mpath href="#cablePath"/>
      </animateMotion>
    </circle>

    <!-- turbines (tower, nacelle, rotor) -->
    <g fill="#dfe9f2" stroke="none">
      <!-- far, small -->
      <g transform="translate(662 150) scale(.62)">
        <path d="M-2.5 0 L-4.5 74 L4.5 74 L2.5 0 Z"/>
        <g><use href="#blades"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></g>
        <circle r="4.5" fill="#f6b37a"/>
      </g>
      <g transform="translate(740 132) scale(.85)">
        <path d="M-3 0 L-5 75 L5 75 L3 0 Z"/>
        <g><use href="#blades"/>
          <animateTransform attributeName="transform" type="rotate" from="40" to="400" dur="4.6s" repeatCount="indefinite"/></g>
        <circle r="5" fill="#f6b37a"/>
      </g>
      <g transform="translate(822 140) scale(.74)">
        <path d="M-3 0 L-5 76 L5 76 L3 0 Z"/>
        <g><use href="#blades"/>
          <animateTransform attributeName="transform" type="rotate" from="80" to="440" dur="5.3s" repeatCount="indefinite"/></g>
        <circle r="5" fill="#f6b37a"/>
      </g>
      <!-- near, large -->
      <g transform="translate(905 118)">
        <path d="M-3.5 0 L-6 78 L6 78 L3.5 0 Z"/>
        <g><use href="#blades"/>
          <animateTransform attributeName="transform" type="rotate" from="20" to="380" dur="3.8s" repeatCount="indefinite"/></g>
        <circle r="5.5" fill="#f6b37a"/>
      </g>
    </g>

    <!-- text -->
    <text class="tag fade1" x="40" y="70">CRITICAL MATERIALS · ENERGY SYSTEMS · OPTIMISATION</text>
    <text class="title fade2" x="40" y="118">Thashmika Bandara</text>
    <text class="sub fade3" x="40" y="148">PhD researcher · City St George's, University of London</text>
    <text class="sub fade3" x="40" y="172">Cleaner renewables, down to the copper in the cables.</text>
  </g>
</svg>
